<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="660" fill="#ffffff"/>

  <text class="title" x="40" y="52">Orion.Abstractions - the shared spine of the Orion family</text>
  <text class="subtitle" x="40" y="78">Two packages: the contracts every Orion library builds on, and the test doubles that make them deterministic.</text>

  <!-- consumers -->
  <rect class="step" x="40" y="110" width="360" height="64" rx="14"/>
  <text class="label" x="220" y="137" text-anchor="middle">Orion family packages</text>
  <text class="small" x="220" y="158" text-anchor="middle">OrionLock, OrionPatch, OrionAudit, ...</text>

  <rect class="step" x="430" y="110" width="360" height="64" rx="14"/>
  <text class="label" x="610" y="137" text-anchor="middle">Your application</text>
  <text class="code" x="610" y="158" text-anchor="middle">services.AddOrionAbstractions()</text>

  <rect class="step" x="850" y="110" width="310" height="64" rx="14"/>
  <text class="label" x="1005" y="137" text-anchor="middle">Your test project</text>
  <text class="small" x="1005" y="158" text-anchor="middle">injects the test doubles</text>

  <path class="flow" d="M220,174 L220,228"/>
  <text class="edge" x="230" y="206">binds to 1.x</text>
  <path class="flow" d="M610,174 L610,228"/>
  <text class="edge" x="620" y="206">registers the clock</text>
  <path class="flow" d="M1005,174 L1005,228"/>
  <text class="edge" x="1015" y="206">test reference</text>

  <!-- Orion.Abstractions container -->
  <rect class="note" x="40" y="230" width="750" height="290" rx="14"/>
  <text class="label" x="60" y="258">Orion.Abstractions</text>
  <text class="small" x="770" y="258" text-anchor="end">namespace Moongazing.Orion.Abstractions.*</text>

  <!-- row 1 -->
  <rect class="step" x="60" y="275" width="225" height="110" rx="12"/>
  <text class="label" x="172" y="300" text-anchor="middle">Observers</text>
  <text class="code" x="172" y="324" text-anchor="middle">SafeObserverInvoker</text>
  <text class="small" x="172" y="346" text-anchor="middle">Invoke, InvokeAsync,</text>
  <text class="small" x="172" y="365" text-anchor="middle">Resolve</text>

  <rect class="step" x="302" y="275" width="225" height="110" rx="12"/>
  <text class="label" x="414" y="300" text-anchor="middle">Diagnostics</text>
  <text class="code" x="414" y="324" text-anchor="middle">OrionInstrumentation</text>
  <text class="code" x="414" y="344" text-anchor="middle">OrionTelemetry</text>
  <text class="small" x="414" y="366" text-anchor="middle">ActivitySource + Meter, names</text>

  <rect class="step" x="544" y="275" width="225" height="110" rx="12"/>
  <text class="label" x="656" y="300" text-anchor="middle">Time</text>
  <text class="code" x="656" y="324" text-anchor="middle">IOrionClock</text>
  <text class="code" x="656" y="344" text-anchor="middle">SystemOrionClock</text>
  <text class="code" x="656" y="364" text-anchor="middle">OrionDeadline</text>

  <!-- row 2 -->
  <rect class="step" x="60" y="395" width="225" height="110" rx="12"/>
  <text class="label" x="172" y="420" text-anchor="middle">Configuration</text>
  <text class="code" x="172" y="444" text-anchor="middle">OrionOptions</text>
  <text class="code" x="172" y="464" text-anchor="middle">AddOrionOptions</text>
  <text class="code" x="172" y="484" text-anchor="middle">OrionOptionsValidator</text>

  <rect class="step" x="302" y="395" width="225" height="110" rx="12"/>
  <text class="label" x="414" y="420" text-anchor="middle">Results</text>
  <text class="code" x="414" y="444" text-anchor="middle">IOrionResult</text>
  <text class="code" x="414" y="464" text-anchor="middle">OrionError</text>
  <text class="code" x="414" y="484" text-anchor="middle">OrionErrorCodes</text>

  <rect class="step" x="544" y="395" width="225" height="110" rx="12"/>
  <text class="label" x="656" y="420" text-anchor="middle">DI entry point</text>
  <text class="code" x="656" y="444" text-anchor="middle">AddOrionAbstractions</text>
  <text class="small" x="656" y="466" text-anchor="middle">TryAddSingleton:</text>
  <text class="small" x="656" y="485" text-anchor="middle">IOrionClock -&gt; SystemOrionClock</text>

  <!-- Testing package -->
  <rect class="step" x="850" y="230" width="310" height="160" rx="14"/>
  <text class="label" x="1005" y="258" text-anchor="middle">Orion.Abstractions.Testing</text>
  <text class="code" x="1005" y="288" text-anchor="middle">FrozenOrionClock</text>
  <text class="code" x="1005" y="310" text-anchor="middle">RecordingObserver&lt;TObserver&gt;</text>
  <text class="code" x="1005" y="332" text-anchor="middle">DeterministicFaultInjector</text>
  <text class="code" x="1005" y="354" text-anchor="middle">DeterministicFaultException</text>

  <path class="flow" d="M850,310 L792,310"/>
  <text class="edge" x="820" y="300" text-anchor="middle">uses</text>

  <!-- note -->
  <rect class="note" x="850" y="410" width="310" height="110" rx="10"/>
  <text class="small" x="868" y="438">No Orion dependencies of its own.</text>
  <text class="small" x="868" y="460">net8.0, net9.0, net10.0; NativeAOT</text>
  <text class="small" x="868" y="480">and trim clean.</text>
  <text class="small" x="868" y="502">Public surface frozen across 1.x.</text>

  <!-- external dependencies -->
  <path class="flow" d="M220,520 L220,558"/>
  <path class="flow" d="M610,520 L610,558"/>

  <rect class="ext" x="40" y="560" width="360" height="70" rx="14"/>
  <text class="label" x="220" y="588" text-anchor="middle">Microsoft.Extensions.*</text>
  <text class="small" x="220" y="610" text-anchor="middle">DependencyInjection.Abstractions, Options</text>

  <rect class="ext" x="430" y="560" width="360" height="70" rx="14"/>
  <text class="label" x="610" y="588" text-anchor="middle">.NET base class library</text>
  <text class="small" x="610" y="610" text-anchor="middle">TimeProvider, ActivitySource, Meter</text>
</svg>
